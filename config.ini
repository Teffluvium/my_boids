[screen]
# Screen dimensions in pixels [width, height]
winsize = [1200, 900]
# Use fullscreen mode?
fullscreen = no
# Selecct the boundary type: either WRAP or BOUNCE
boundary_type = BOUNCE
# Show performance metrics and the predator detection range circle?
show_metrics = no

[boids]
# Number of boids
num_boids = 28
# Size of the boids
size = 10
# Maximum speed of the boids
max_speed = 8.0
# Amount that the boids move towards the center of the flock
cohesion_factor = 0.01
# Desired separation between boids
separation = 20.0
# Amount that the boids move away from each other
avoid_factor = 0.108
# Amount that the boids try to match the velocity of the flock
alignment_factor = 0.05
# Radius of boids that can influence each other
visual_range = 40
# Boid reaction mode to predators: either 'avoid' or 'attract'
boid_avoid_mode = avoid

[predator]
# Predator attack mode: 'mouse', 'center', 'nearest', or 'isolated'
predator_attack_mode = isolated
# Distance at which the predator senses boids and boids react to the predator
predator_detection_range = 400.3
# Peak strength of the boids' reaction, fading linearly to zero at the range edge
predator_reaction_strength = 0.88
